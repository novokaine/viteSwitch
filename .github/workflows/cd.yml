name: CD - Remote deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: main

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Configure SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Remote deploy
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          TARGET: ${{ secrets.TARGET_DIR }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "${HOST}" || { echo "Missing SSH_HOST secret"; exit 1; }
          test -n "${USER}" || { echo "Missing SSH_USER secret"; exit 1; }
          test -n "${TARGET}" || { echo "Missing TARGET_DIR secret"; exit 1; }

          case "${HOST}" in
            http://*|https://*)
              echo "SSH_HOST must contain only the hostname or IP, without http:// or https://"
              exit 1
              ;;
          esac

          ssh-keyscan -p 22 -H "${HOST}" >> ~/.ssh/known_hosts
          ssh -p 22 -o StrictHostKeyChecking=no ${USER}@${HOST} "TARGET_DIR='${TARGET}' BRANCH_NAME='${BRANCH}' REPO_NAME='${REPO}' SSH_USER_NAME='${USER}' bash -s" <<'EOF'
          set -e

          mkdir -p "$TARGET_DIR"
          if [ ! -w "$TARGET_DIR" ]; then
            echo "TARGET_DIR is not writable by ${SSH_USER_NAME}: ${TARGET_DIR}"
            exit 1
          fi

          cd "$TARGET_DIR"

          if [ -d .git ]; then
            git fetch origin "$BRANCH_NAME"
            git reset --hard
            git clean -fd
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"
          else
            git clone --branch "$BRANCH_NAME" "git@github.com:$REPO_NAME" .
          fi

          if [ ! -f .env ]; then
            echo ".env is missing in $TARGET_DIR"
            exit 1
          fi

          if grep -Eq '^[[:space:]]*NODE_ENV=development([[:space:]]*)$' .env; then
            echo "Remote .env must set NODE_ENV=production for deployed environments"
            exit 1
          fi

          docker compose up -d --build --remove-orphans
          docker image prune -f
          EOF
