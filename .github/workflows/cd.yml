name: CD - Remote deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - Production
          - Staging
      branch:
        description: "Branch to deploy"
        required: true
        default: main

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'Production' || 'Staging') }}
    concurrency:
      group: frontend-deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client rsync

      - name: Configure SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Remote deploy frontend
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
          PUBLIC_DIR: ${{ secrets.PUBLIC_DIR }}
          BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'Production' && 'production' || 'staging') || (github.ref_name == 'main' && 'production' || 'staging') }}
        run: |
          test -n "${HOST}" || { echo "Missing SSH_HOST secret"; exit 1; }
          test -n "${USER}" || { echo "Missing SSH_USER secret"; exit 1; }
          test -n "${TARGET}" || { echo "Missing TARGET_DIR secret"; exit 1; }
          test -n "${PUBLIC_DIR}" || { echo "Missing PUBLIC_DIR secret"; exit 1; }
          PORT="${PORT:-22}"

          case "${HOST}" in
            http://*|https://*)
              echo "SSH_HOST must contain only the hostname or IP, without http:// or https://"
              exit 1
              ;;
          esac

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          ssh -p "${PORT}" -o StrictHostKeyChecking=no ${USER}@${HOST} "\
            set -e; \
            mkdir -p ${TARGET}; \
            mkdir -p ${PUBLIC_DIR}; \
            cd ${TARGET}; \
            if [ -d .git ]; then \
              git fetch origin ${BRANCH}; \
              git checkout ${BRANCH} || git checkout -b ${BRANCH} origin/${BRANCH}; \
              git reset --hard origin/${BRANCH}; \
            else \
              git clone --branch ${BRANCH} git@github.com:${REPO} .; \
            fi; \
            if [ ! -f .env.${BUILD_MODE}.local ]; then \
              echo '.env.'${BUILD_MODE}'.local is missing in '${TARGET}; \
              exit 1; \
            fi; \
            npm ci; \
            npm run build:${BUILD_MODE}; \
            rsync -a --delete dist/ ${PUBLIC_DIR}/"
