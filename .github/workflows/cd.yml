name: CD - Remote deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: main

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Configure SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Remote deploy
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          TARGET: ${{ secrets.TARGET_DIR }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "${HOST}" || { echo "Missing SSH_HOST secret"; exit 1; }
          test -n "${USER}" || { echo "Missing SSH_USER secret"; exit 1; }
          test -n "${TARGET}" || { echo "Missing TARGET_DIR secret"; exit 1; }
          PORT="${PORT:-22}"

          case "${HOST}" in
            http://*|https://*)
              echo "SSH_HOST must contain only the hostname or IP, without http:// or https://"
              exit 1
              ;;
          esac

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          ssh -p "${PORT}" -o StrictHostKeyChecking=no ${USER}@${HOST} "\
            set -e; \
            mkdir -p ${TARGET}; \
            cd ${TARGET}; \
            if [ -d .git ]; then \
              git fetch origin ${BRANCH}; \
              git checkout ${BRANCH} || git checkout -b ${BRANCH} origin/${BRANCH}; \
              git reset --hard origin/${BRANCH}; \
            else \
              git clone --branch ${BRANCH} git@github.com:${REPO} .; \
            fi

            if [ ! -f .env ]; then
              echo ".env is missing in $TARGET_DIR"
              exit 1
            fi

            docker compose --env-file .env up -d --build --remove-orphans
            docker image prune -f"
